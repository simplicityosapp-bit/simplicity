overrides:
  react: 19.2.3
  react-dom: 19.2.3

packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': false
  # sharp's install script compiles from source when it cannot verify a
  # prebuilt binary, and it needs node-gyp to do it. On the EAS macOS
  # builder that check fails, the compile fails, and it takes the whole
  # workspace install down with it - so an iOS build died before it ever
  # reached a compiler. Nothing needs the script: sharp loads its prebuilt
  # @img/sharp-<platform> package at require time, and the only things here
  # that import sharp are three manual asset-compression scripts in
  # apps/web/scripts, which no build or deploy runs.
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.2 || 57.0.23'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.2'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1 || 57.0.11
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.2
  - expo@57.0.0 || 57.0.21
  - '@expo/metro-file-map@57.0.3'
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
